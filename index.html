<style>

.selfie-on .map-board { background: #e5f3df45; }
.map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.token-player .token-name { fill: #fff9e6; }

[data-landmark="garden"] { --marker-bg: #e7edda; --marker-fg: #3b6549; }

  border: 1px solid #fff8e6;
  border-radius: 12px;
  background: var(--marker-bg);
  box-shadow: 0 2px 8px #132c2433;
}
.ar-landmark-icon .icon { width: 27px; height: 27px; }
.ar-landmark-name, .offscreen-marker {
  padding: 3px 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--forest-deep);
  background: #f9fff4ec;
  font-size: 11px;
  font-weight: 750;
  white-space: nowrap;
}
.ar-landmark-name { display: grid; gap: 2px; text-align: center; line-height: 1.2; }
.ar-landmark-name small { color: #3d5d4a; font-size: 11px; }
.offscreen-group { position: absolute; top: 21%; display: grid; gap: 4px; }
.offscreen-group.left { left: 8px; justify-items: start; }
.offscreen-group.right { right: 8px; justify-items: end; }
.offscreen-marker { display: flex; gap: 4px; align-items: center; font-size: 10px; }
.offscreen-marker .icon { width: 12px; height: 12px; color: #3d5d4a; }
.turn-pad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.turn-btn {
  min-height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 0 3px;
  border: 1px solid #d7dfcf;
  border-radius: 9px;
  background: #f3faefc7;
  color: var(--forest-deep);
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
}
.turn-btn .icon { width: 16px; height: 16px; }
.ar-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 9px; }
.ar-tools .quiet-btn { font-size: 12px; padding-inline: 8px; }
.ar-tools .active { background: #e5efdf; border-color: #95ac96; color: var(--forest-deep); }
.sensor-status { flex: 1; padding-left: 3px; color: var(--muted); font-size: 11px; line-height: 1.4; text-align: right; }
.question-panel { display: flex; flex-direction: column; padding: clamp(16px, 2.2vw, 30px); }
.question-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 9px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 750;
}
.mission-number {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 8px;
  border-radius: 6px;
  color: var(--rust);
  background: var(--rust-soft);
  font-size: 11px;
  font-weight: 850;
  letter-spacing: .04em;
}
.mission-number b { font-size: 13px; }
.question-title {
  margin-top: 11px;
  font-size: clamp(23px, 2.5vw, 35px);
  line-height: 1.28;
  font-weight: 850;
  letter-spacing: -.025em;
  overflow-wrap: anywhere;
}
.question-note { margin-top: 8px; color: var(--muted); font-size: 14px; line-height: 1.56; }
.question-panel.is-answered .question-note { display: none; }
.options {
  margin-top: clamp(12px, 2.15vh, 24px);
  padding-top: 10px;
  border-top: 1px solid #e0e4d8;
}
.options-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 7px; }
.options-head h2 { font-size: 13px; font-weight: 850; }
.options-head span { color: var(--muted); font-size: 11px; font-weight: 650; }
.answer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.answer-btn {
  min-width: 0;
  min-height: 55px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border: 1px solid #d9e0d2;
  border-radius: 10px;
  color: var(--ink);
  background: #f8fcf4d9;
  text-align: left;
}
.option-key {
  display: grid;
  place-items: center;
  flex: none;
  width: 26px;
  height: 26px;
  border: 1px solid #dbe2d3;
  border-radius: 6px;
  color: var(--forest);
  background: #eff3e9;
  font: 750 12px var(--mono);
}
.option-key .icon { width: 16px; height: 16px; }
.option-copy { min-width: 0; font-size: 15px; line-height: 1.35; font-weight: 800; white-space: pre-line; }
.option-copy small { display: block; margin-top: 2px; color: var(--muted); font: 650 11px var(--mono); }
.answer-btn.correct { border-color: #6f9a79; background: #e7f1e5; }
.answer-btn.correct .option-key { border-color: var(--forest); color: white; background: var(--forest); }
.answer-btn.wrong { border-color: #bc7a68; background: #f7eae3; }
.answer-btn.wrong .option-key { border-color: #a74b39; color: white; background: #a74b39; }
.hint-wrap { margin-top: 10px; }
.hint-btn {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px 3px 2px;
  border-radius: 8px;
  color: var(--forest);
  background: transparent;
  font-size: 13px;
  font-weight: 800;
  text-align: left;
}
.hint-btn .icon { width: 18px; height: 18px; }
.hint-btn small { color: var(--muted); font-size: 11px; font-weight: 650; }
.hint-text {
  margin-top: 4px;
  padding: 8px 10px;
  border-left: 2px solid #bb8541;
  border-radius: 0 7px 7px 0;
  color: #624727;
  background: #fbf1da;
  font-size: 13px;
  line-height: 1.48;
}
.feedback { margin-top: auto; padding-top: 11px; }
.feedback-copy {
  padding: 8px 10px;
  border-left: 3px solid #6e9678;
  border-radius: 0 8px 8px 0;
  background: #ebf2e7;
}
.feedback.bad .feedback-copy { border-left-color: #b57059; background: #faede6; }
.feedback-heading { display: flex; align-items: baseline; gap: 7px; }
.feedback-heading strong { color: var(--forest-deep); font-size: 14px; }
.feedback.bad .feedback-heading strong { color: #903f2c; }
.earned { color: var(--forest); font-size: 12px; font-weight: 800; }
.feedback-copy p { margin-top: 3px; color: #3e5345; font-size: 13px; line-height: 1.48; }
.feedback.bad .feedback-copy p { color: #68493c; }
.action-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.result-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.result-item { padding: 9px 11px; border: 1px solid #d9e0d2; border-radius: 9px; background: #f5f7ed; }
.result-item strong { display: block; margin-top: 3px; color: var(--forest); font-size: 22px; }
.result-item span { color: var(--muted); font-size: 12px; font-weight: 700; }
.toast {
  position: fixed;
  z-index: 5;
  bottom: max(14px, env(safe-area-inset-bottom));
  left: 50%;
  width: max-content;
  max-width: calc(100% - 28px);
  transform: translate(-50%, 5px);
  padding: 10px 14px;
  border-radius: 9px;
  color: #fffdf2;
  background: #1d3d2e;
  box-shadow: 0 4px 20px #152e2338;
  font-size: 13px;
  line-height: 1.4;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (hover: hover) {
  .primary-btn:hover { background: #2f6149; }
  .quiet-btn:hover:not(:disabled), .turn-btn:hover { background: #e8efe3; }
  .answer-btn:hover:not(:disabled), .difficulty-btn:hover { border-color: #6e9175; }
  .view-btn:hover:not(.active), .hint-btn:hover { background: #e5eddf; }
}
@media (orientation: landscape) and (max-height: 720px) {
  .mast-inner { min-height: 64px; }
  .welcome { padding-block: 22px; padding-bottom: max(22px, env(safe-area-inset-bottom)); }
  .welcome h1 { font-size: clamp(43px, 5.5vw, 72px); }
  .welcome-lead { margin-top: 12px; }
  .difficulty { margin-top: 16px; }
  .stage { min-height: clamp(465px, calc(100svh - 100px), 620px); }
  .question-panel { padding: 15px 17px; }
  .question-title { font-size: clamp(22px, 2.4vw, 30px); }
  .question-note { margin-top: 6px; font-size: 13px; }
}
@media (orientation: landscape) and (max-width: 950px) {
  :root { --gutter: 14px; }
  .game { grid-template-columns: minmax(0, 1.2fr) minmax(290px, 1fr); gap: 10px; }
  .stage-header { padding-inline: 9px; }
  .view-panel { margin-inline: 8px; }
  .stage-heading { gap: 6px; }
  .stage-heading p { display: none; }
  .view-btn { padding-inline: 6px; }
  .sensor-status { display: none; }
}
@media (orientation: portrait), (max-width: 710px) {
  .welcome, .game { grid-template-columns: 1fr; }
  .welcome { justify-items: center; gap: 24px; }
  .welcome-copy, .cover { width: min(100%, 570px); }
  .welcome h1 { font-size: clamp(43px, 8.2vw, 68px); }
  .stage { min-height: clamp(445px, 70vw, 590px); }
  .question-panel { min-height: 420px; }
}
@media (max-width: 480px) {
  :root { --gutter: 10px; }
  .mast-inner { min-height: 60px; gap: 8px; flex-wrap: wrap; padding-block: 5px; }
  .brand { gap: 6px; }
  .brand-name { font-size: 14px; }
  .brand-mark { width: 36px; height: 36px; }
  .brand-caption, .restart-text, .selfie-btn span, .progress > span { display: none; }
  .stage-index { display: none; }
  .stage-heading h2 { font-size: 14px; }
  .sensor-status { display: none; }
  .score { gap: 4px; }
  .score strong { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; }
}
</style>
</head>

<script>
(() => {
'use strict';

const DIRS=[
  {id:'N',name:'北',dx:0,dy:-1,angle:0},
  {id:'NE',name:'東北',dx:1,dy:-1,angle:45},
  {id:'E',name:'東',dx:1,dy:0,angle:90},
  {id:'SE',name:'東南',dx:1,dy:1,angle:135},
  {id:'S',name:'南',dx:0,dy:1,angle:180},
  {id:'SW',name:'西南',dx:-1,dy:1,angle:225},
  {id:'W',name:'西',dx:-1,dy:0,angle:270},
  {id:'NW',name:'西北',dx:-1,dy:-1,angle:315}
];
const LANDMARKS=[
  {id:'water',name:'噴泉'},
  {id:'garden',name:'仙人掌園'},
  {id:'station',name:'研究站'},
  {id:'telescope',name:'觀星台'},
  {id:'play',name:'遊樂場'},
  {id:'gate',name:'太空閘'},
  {id:'pond',name:'水培池'},
  {id:'power',name:'能源站'}
];
const TURN_CHOICES=[
  {id:'-135',label:'左轉 135°'}, {id:'-90',label:'左轉 90°'}, {id:'-45',label:'左轉 45°'},
  {id:'45',label:'右轉 45°'}, {id:'90',label:'右轉 90°'}, {id:'135',label:'右轉 135°'}
];
const PLAYER = { id: 'player', name: '人物', x: 0, y: 0 };
const SVG_NS = 'http://www.w3.org/2000/svg';
const MAP_STEP = 44;
const MAP_CENTER = { x: 320, y: 210 };
const METRES_PER_CELL = 100;
const metres = cells => `${Math.round(cells * METRES_PER_CELL)} m`;
const ui = Object.fromEntries([...document.querySelectorAll('[id]')].map(element => [element.id, element]));
const viewButtons = [ui.mapModeBtn, ui.arModeBtn];

let modeChoice = 'teaching';
let state = null;
let toastTimeout = 0;
let cameraStream = null;
let cameraReady = false;
let cameraPending = false;
let cameraRequestSeq = 0;
let sensorRequestSeq = 0;
let sensorLastRaw = null;
let sensorZero = null;
let sensorActive = false;
let sensorListening = false;
let sensorWaiting = false;
let sensorRaf = 0;
let sensorTimeout = 0;
let sensorSource = '';

const normalize=a=>(a%360+360)%360;
const signedAngle=a=>{let d=normalize(a);return d>180?d-360:d;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(array){
  const a=[...array];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
const dir=id=>DIRS.find(d=>d.id===id);
const dirName=id=>dir(id)?.name||id;
const byAngle=angle=>DIRS[Math.round(normalize(angle)/45)%8];
function bearing(a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  if(dx===0&&dy===0)throw Error('Identical points for bearing');
  return byAngle(Math.atan2(dx,-dy)*180/Math.PI).id;
}
function where(id) {
  return id === 'player' ? PLAYER : state.world.find(landmark => landmark.id === id);
}
function dirOptions(correct){
  return shuffle([dir(correct),...shuffle(DIRS.filter(d=>d.id!==correct)).slice(0,3)]).map(d=>({id:d.id,label:d.name,small:d.id}));
}
function landmarkOptions(correct){
  return shuffle([where(correct),...shuffle(state.world.filter(l=>l.id!==correct)).slice(0,3)])
   .map(l=>({id:l.id,label:l.name}));
}
function turnOptions(correct){
  return shuffle([TURN_CHOICES.find(c=>c.id===String(correct)),
    ...shuffle(TURN_CHOICES.filter(c=>c.id!==String(correct))).slice(0,3)]);
}
function routeOptions(target) {
  const horizontal = metres(Math.abs(target.x));
  const vertical = metres(Math.abs(target.y));
  const xDir = target.x > 0 ? '東' : '西';
  const yDir = target.y > 0 ? '南' : '北';
  const wrongX = target.x > 0 ? '西' : '東';
  const wrongY = target.y > 0 ? '北' : '南';
  const route = (id, first, second) => ({
    id, label: `向${first}走 ${horizontal}\n再向${second}走 ${vertical}`
  });
  return shuffle([
    route('correct', xDir, yDir), route('wrong-x', wrongX, yDir),
    route('wrong-y', xDir, wrongY), route('wrong-both', wrongX, wrongY)
  ]);
}
function worldGenerate(){
  const positions=shuffle(DIRS).slice(0,6);
  const length=2+Math.floor(Math.random()*2);
  return shuffle(LANDMARKS).slice(0,6).map((landmark,i)=>{
    const p=positions[i];
    return {...landmark,x:p.dx*length,y:p.dy*length,directionId:p.id};
  });
}
function generateQuestions(){
  const shuffled=shuffle(state.world);
  const exactPairs=[];
  for(const first of shuffled)for(const second of shuffled){
    if(first.id===second.id)continue;
    const dx=second.x-first.x,dy=second.y-first.y;
    if(dx===0||dy===0||Math.abs(dx)===Math.abs(dy))exactPairs.push([first,second]);
  }
  const [a,b]=pick(exactPairs);
  const secondPairs=exactPairs.filter(([x,y])=>x.id!==a.id||y.id!==b.id);
  const [c,d]=pick(secondPairs.length?secondPairs:exactPairs);
  const [e,f]=shuffle(shuffled.filter(x=>x.id!==a.id&&x.id!==b.id)).slice(0,2);
  const routeTarget=pick(state.world.filter(x=>x.x!==0&&x.y!==0));
  const routeCorner={x:routeTarget.x,y:0};
  const routeStep=metres(Math.abs(routeTarget.x));
  const pairDir=bearing(where(a.id),where(b.id));
  const cdDir=bearing(where(c.id),where(d.id));
  const returnDir=bearing(where(e.id),where('player'));
  const arTarget=pick(state.world.filter(x=>x.id!==f.id));
  // The chosen hypothetical starting bearing always needs a 45, 90 or 135 degree turn.
  const turn=pick([-135,-90,-45,45,90,135]);
  const startDir=byAngle(dir(arTarget.directionId).angle-turn);
  const relTarget=pick(state.world.filter(x=>x.id!==arTarget.id));
  const relativeAngle=pick([45,90,135,180,225,270,315]);
  const relFacing=byAngle(dir(relTarget.directionId).angle-relativeAngle);
  const relativeNames={0:'正前方',45:'右前方',90:'右方',135:'右後方',180:'正後方',225:'左後方',270:'左方',315:'左前方'};
  const relOptions=shuffle([0,45,90,135,180,225,270,315]).filter(x=>x!==relativeAngle).slice(0,3);
  const relAnswers=shuffle([relativeAngle,...relOptions].map(x=>({id:String(x),label:relativeNames[x],small:`${x}°`})));
  return [
    {id:1,mode:'map',skill:'人物 → 景物',type:'object',title:`在人物的「${dirName(a.directionId)}」方，是哪個景物？`,
      note:'先定北，再從中心向指定方向看。',hint:'把人物當成指南針中心，從上方的北開始找。',
      options:landmarkOptions(a.id),correct:a.id,
      explanation:`人物在中心，${a.name} 位於人物的${dirName(a.directionId)}方。`,paths:[['player',a.id]]},
    {id:2,mode:'map',skill:'景物 ↔ 景物',type:'direction',title:`以「${a.name}」為起點，「${b.name}」在它的哪個方向？`,
      note:'先站到題目指定的景物，再判斷方向。',hint:`想像先站在${a.name}，再畫箭嘴指向${b.name}。`,
      options:dirOptions(pairDir),correct:pairDir,
      explanation:`從${a.name}指向${b.name}的箭嘴，整體朝${dirName(pairDir)}。`,paths:[[a.id,b.id]]},
    {id:3,mode:'map',skill:'雙段路線',type:'direction',title:`由中心先到「${c.name}」，再去「${d.name}」。第二段路朝哪方？`,
      note:'從第一個景物出發，找出第二段的方向。',hint:`先忽略中心，看看${c.name}到${d.name}的連線。`,
      options:dirOptions(cdDir),correct:cdDir,
      explanation:`路線分兩段：中心 → ${c.name} → ${d.name}。第二段由${c.name}到${d.name}，朝${dirName(cdDir)}。`,paths:[['player',c.id],[c.id,d.id]]},
    {id:4,mode:'map',skill:'反方向推理',type:'direction',title:`假如站在「${e.name}」，要回到中心的人物，應向哪方？`,
      note:'人物仍在地圖中心；題目是想像從景物回程。',hint:`先找人物到${e.name}的方向，再轉180°。`,
      options:dirOptions(returnDir),correct:returnDir,
      explanation:`${e.name}在中心的${dirName(e.directionId)}方，返回中心要轉向相反的${dirName(returnDir)}方。`,paths:[[e.id,'player']]},
    {id:5,mode:'ar',skill:'第一身定位',type:'direction',title:`由人物看，「${f.name}」在遊戲世界的哪個方位？`,
      note:'轉動視角，讓景物對準指南條中央。',hint:'把指南條中央對準景物，再看中央的 N／NE／E 等方位。',
      options:dirOptions(f.directionId),correct:f.directionId,
      explanation:`${f.name}固定在人物的${dirName(f.directionId)}方。轉動 iPad 或按鈕，只改變看它的角度。`,paths:[['player',f.id]]},
    {id:6,mode:'ar',skill:'相對轉向',type:'turn',suggestFacing:startDir.id,
      title:`假設人物面向「${startDir.name}」，要正對「${arTarget.name}」，最短應怎樣轉？`,
      note:'可先用轉向按鈕，對準題目指定的起始方向。',
      hint:`目標在${dirName(arTarget.directionId)}方，從${startDir.name}轉到它，順或逆時針哪邊更短？`,
      options:turnOptions(turn),correct:String(turn),
      explanation:`起始面向是${startDir.name}，${arTarget.name}在${dirName(arTarget.directionId)}方；最短轉向是${turn<0?'向左':'向右'}${Math.abs(turn)}°。`,paths:[['player',arTarget.id]]},
    {id:7,mode:'ar',skill:'身體左右方',type:'relative',suggestFacing:relFacing.id,
      title:`假設人物面向「${relFacing.name}」，「${relTarget.name}」會在身體的哪一邊？`,
      note:'想像自己面向指定方向，再判斷前、後、左、右。',
      hint:`假想自己的正前方是${relFacing.name}，然後看${relTarget.name}相對哪一側。`,
      options:relAnswers,correct:String(relativeAngle),
      explanation:`人物面向${relFacing.name}時，${relTarget.name}位於${relativeNames[relativeAngle]}。位置沒變，變的是自己的面向。`,paths:[['player',relTarget.id]]},
    {id:8,mode:'ar',skill:'兩步路線',type:'route',title:`從中心前往「${routeTarget.name}」，哪一條兩段路線能走到它？`,
      note:'切到俯視地圖，用比例尺讀出兩段路程。',
      hint:`先看目標在東面還是西面，再看它在北面還是南面。兩段各走 ${routeStep}。`,
      options:routeOptions(routeTarget),correct:'correct',
      explanation:`${routeTarget.name}在中心的${dirName(routeTarget.directionId)}方。先走 ${routeStep}，轉 90° 後再走 ${routeStep}。`,paths:[['player',routeCorner],[routeCorner,routeTarget.id]]}
  ];
}
const current = () => state.questions[state.index];
const pad = (number, length = 2) => String(number).padStart(length, '0');

function svgNode(name, attrs = {}, label) {
  const element = document.createElementNS(SVG_NS, name);
  for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
  if (label !== undefined) element.textContent = label;
  return element;
}

function icon(name) {
  const element = svgNode('svg', { class: 'icon', 'aria-hidden': 'true' });
  element.append(svgNode('use', { href: '#i-' + name }));
  return element;
}

function node(name, className, label) {
  const element = document.createElement(name);
  element.className = className;
  if (label !== undefined) element.textContent = label;
  return element;
}

function selectButton(button, active) {
  button.classList.toggle('active', active);
  button.setAttribute('aria-pressed', String(active));
}

function toast(message) {
  window.clearTimeout(toastTimeout);
  ui.toast.textContent = message;
  ui.toast.classList.toggle('show', Boolean(message));
  if (message) toastTimeout = window.setTimeout(() => toast(''), 3100);
}

function setScreen(playing) {
  ui.introScreen.hidden = playing;
  ui.introEdition.hidden = playing;
  ui.gameScreen.hidden = !playing;
  ui.gameToolbar.hidden = !playing;
}

function focusQuestion() {
  ui.questionTitle.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function showIntro() {
  if (!ui.introScreen.hidden) return;
  disableSensor();
  toast('');
  setScreen(false);
  ui.welcomeTitle.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function setDifficulty(difficulty) {
  modeChoice = difficulty;
  selectButton(ui.introTeachingBtn, difficulty === 'teaching');
  selectButton(ui.introChallengeBtn, difficulty === 'challenge');
}

function resetGame() {
  state = {
    world: worldGenerate(), questions: [], index: 0, score: 0, mode: 'map', heading: 0,
    phase: 'playing', answered: false, hintUsed: false, choice: null, results: [], difficulty: modeChoice
  };
  state.questions = generateQuestions();
  disableSensor();
  setMode('map');
  renderQuestion();
  renderMap();
  renderProgress();
  focusQuestion();
}

function setMode(mode) {
  state.mode = mode;
  const isMap = mode === 'map';
  ui.mapStage.hidden = !isMap;
  ui.arStage.hidden = isMap;
  ui.viewIndex.textContent = isMap ? '01' : '02';
  selectButton(viewButtons[0], isMap);
  selectButton(viewButtons[1], !isMap);
  if (!isMap) renderAR();
}

function renderProgress() {
  const finished = state.phase === 'results';
  ui.progressLabel.textContent = `${finished ? state.questions.length : state.index + 1} / ${state.questions.length}`;
  ui.scoreLabel.textContent = pad(state.score, 3);
  ui.progressTrack.replaceChildren(...state.questions.map((_, index) => {
    const segment = node('span', 'progress-segment');
    segment.classList.toggle('done', finished || index < state.index || (index === state.index && state.answered));
    segment.classList.toggle('active', !finished && index === state.index && !state.answered);
    return segment;
  }));
}

function renderQuestion() {
  const question = current();
  const teaching = state.difficulty === 'teaching';
  ui.questionPanel.classList.toggle('is-answered', state.answered);
  ui.optionsPanel.hidden = false;
  ui.resultsPanel.hidden = true;
  ui.chooseModeBtn.hidden = true;
  ui.missionNumber.textContent = pad(state.index + 1);
  ui.questionModeHint.textContent = `${question.mode === 'map' ? '俯視' : '第一身 AR'} · ${question.skill}`;
  ui.questionTitle.textContent = question.title;
  ui.questionNote.textContent = question.note;
  ui.classModeLabel.textContent = teaching ? '教學模式' : '挑戰模式';
  ui.answerGrid.replaceChildren(...question.options.map((option, index) => {
    const button = node('button', 'answer-btn');
    button.type = 'button';
    button.dataset.option = option.id;
    button.disabled = state.answered;
    const letter = String.fromCharCode(65 + index);
    const key = node('span', 'option-key', letter);
    key.setAttribute('aria-hidden', 'true');
    const copy = node('span', 'option-copy', option.label);
    if (option.small) copy.append(node('small', '', option.small));
    button.append(key, copy);
    if (state.answered && option.id === question.correct) {
      button.classList.add('correct');
      button.setAttribute('aria-label', option.label + '，正確答案');
      key.replaceChildren(icon('check'));
    } else if (state.answered && option.id === state.choice) {
      button.classList.add('wrong');
      button.setAttribute('aria-label', option.label + '，你的答案');
      key.replaceChildren(icon('cross'));
    }
    button.addEventListener('click', () => answer(option.id));
    return button;
  }));
  ui.hintWrap.hidden = !teaching || state.answered;
  ui.hintBtn.hidden = state.hintUsed;
  ui.hintBtn.setAttribute('aria-expanded', String(state.hintUsed));
  ui.hintText.hidden = !state.hintUsed;
  ui.hintText.textContent = state.hintUsed ? question.hint : '';
  ui.feedbackBox.hidden = !state.answered;

  if (state.answered) {
    const { correct, earned } = state.results[state.results.length - 1];
    ui.feedbackBox.classList.toggle('bad', !correct);
    ui.feedbackTitle.textContent = correct ? '答對了' : '這題未答對';
    ui.earned.textContent = correct ? `+${earned} 分` : '';
    ui.feedbackText.textContent = teaching ? question.explanation : '綠色選項已標出正確答案。';
    ui.nextBtnText.textContent = state.index === state.questions.length - 1 ? '查看成績' : '下一題';
  }
}

function answer(id) {
  if (state.phase !== 'playing' || state.answered) return;
  const question = current();
  state.answered = true;
  state.choice = id;
  const correct = id === question.correct;
  const earned = correct ? (state.hintUsed ? 80 : 100) : 0;
  state.score += earned;
  state.results.push({ correct, earned });
  renderQuestion();
  renderMap();
  renderProgress();
  ui.feedbackTitle.focus({ preventScroll: true });
}

function next() {
  if (state.phase === 'results') {
    resetGame();
    return;
  }
  if (!state.answered) return;
  if (state.index === state.questions.length - 1) {
    showResults();
    return;
  }
  state.index++;
  state.answered = false;
  state.hintUsed = false;
  state.choice = null;
  const question = current();
  if (question.suggestFacing && !sensorActive && !sensorWaiting) state.heading = dir(question.suggestFacing).angle;
  setMode(question.mode);
  renderQuestion();
  renderMap();
  renderProgress();
  focusQuestion();
}

function showResults() {
  state.phase = 'results';
  const correct = state.results.filter(result => result.correct).length;
  const mapRight = state.results.slice(0, 4).filter(result => result.correct).length;
  const arRight = state.results.slice(4).filter(result => result.correct).length;
  const summaries = [
    ['總分', `${state.score} / 800`], ['答對題數', `${correct} / 8`],
    ['俯視地圖', `${mapRight} / 4`], ['第一身 AR', `${arRight} / 4`]
  ];
  ui.questionPanel.classList.remove('is-answered');
  ui.questionModeHint.textContent = '本局完成';
  ui.questionTitle.textContent = '方向任務完成！';
  ui.questionNote.textContent = '每次出發，地標和題目都會重新排列。';
  ui.optionsPanel.hidden = true;
  ui.hintWrap.hidden = true;
  ui.resultsPanel.hidden = false;
  ui.resultsGrid.replaceChildren(...summaries.map(([label, value]) => {
    const tile = node('div', 'result-item');
    tile.append(node('span', '', label), node('strong', 'mono', value));
    return tile;
  }));
  ui.feedbackBox.classList.remove('bad');
  ui.feedbackTitle.textContent = '回看最後一題';
  ui.earned.textContent = '';
  ui.feedbackText.textContent = '切到俯視地圖，可查看兩段路線的轉折和走向。';
  ui.chooseModeBtn.hidden = false;
  ui.nextBtnText.textContent = '再玩一次';
  renderProgress();
  focusQuestion();
}

function showHint() {
  if (state.phase !== 'playing' || state.answered || state.hintUsed || state.difficulty !== 'teaching') return;
  state.hintUsed = true;
  ui.hintBtn.hidden = true;
  ui.hintBtn.setAttribute('aria-expanded', 'true');
  ui.hintText.textContent = current().hint;
  ui.hintText.hidden = false;
  ui.hintText.focus({ preventScroll: true });
}

function mapPosition(item) {
  return { x: MAP_CENTER.x + item.x * MAP_STEP, y: MAP_CENTER.y + item.y * MAP_STEP };
}

function mapToken(item) {
  const player = item.id === 'player';
  const point = mapPosition(item);
  const token = svgNode('g', {
    class: player ? 'map-token token-player' : 'map-token',
    'data-landmark': item.id, transform: `translate(${point.x} ${point.y})`
  });
  const width = Math.max(47, item.name.length * 16 + 13);
  token.append(
    svgNode('circle', { r: player ? 23 : 20, class: 'token-pin' }),
    svgNode('use', { href: '#i-' + item.id, x: -12, y: -12, width: 24, height: 24, class: 'token-icon' }),
    svgNode('rect', { x: -width / 2, y: 24, width, height: 22, rx: 5, class: 'token-label' }),
    svgNode('text', { y: 39, 'text-anchor': 'middle', class: 'token-name' }, item.name)
  );
  return token;
}

function drawRoute(fromRef, toRef) {
  const fromItem = typeof fromRef === 'string' ? where(fromRef) : fromRef;
  const toItem = typeof toRef === 'string' ? where(toRef) : toRef;
  const from = mapPosition(fromItem);
  const to = mapPosition(toItem);
  const distance = Math.hypot(to.x - from.x, to.y - from.y);
  const dx = (to.x - from.x) / distance;
  const dy = (to.y - from.y) / distance;
  const startInset = fromItem.id ? 22 : 0;
  const endInset = toItem.id ? (dy < -.85 ? 48 : 24) : 2;
  ui.pathLayer.append(svgNode('line', {
    x1: from.x + startInset * dx, y1: from.y + startInset * dy,
    x2: to.x - endInset * dx, y2: to.y - endInset * dy,
    class: 'route-line', 'marker-end': 'url(#route-arrow)'
  }));
  if (!toItem.id) {
    ui.pathLayer.append(svgNode('circle', { cx: to.x, cy: to.y, r: 4, class: 'route-corner' }));
  }
}

function renderMap() {
  ui.tokenLayer.replaceChildren(...[PLAYER, ...state.world].map(mapToken));
  ui.pathLayer.replaceChildren();
  if (state.answered) {
    for (const [from, to] of current().paths) drawRoute(from, to);
  }
  const positions = state.world.map(item => {
    const steps = [];
    if (item.x) steps.push(`向${item.x > 0 ? '右' : '左'} ${metres(Math.abs(item.x))}`);
    if (item.y) steps.push(`向${item.y > 0 ? '下' : '上'} ${metres(Math.abs(item.y))}`);
    return `${item.name}：${steps.join('、')}`;
  });
  ui.mapSvgDesc.textContent = `地圖上方是北，人物固定在中心。每格代表 ${metres(1)}。由中心看，${positions.join('；')}。`;
}

function updateSensorUi() {
  const engaged = sensorActive || sensorWaiting;
  selectButton(ui.sensorBtn, engaged);
  ui.sensorBtnText.textContent = engaged ? '關閉感應' : '啟用感應';
  ui.sensorStatus.textContent = sensorActive ? '感應器運作中' : sensorWaiting ? '等待方向資料…' : '按鈕控制轉向';
  ui.arHeadingSubtitle.textContent = sensorActive ? '感應 · 遊戲北' : '手動 · 遊戲北';
  ui.calibrateBtn.disabled = !sensorActive;
}

function renderHUD() {
  const scale = document.createDocumentFragment();
  const heading = state.heading;
  for (let degree = 0; degree < 360; degree += 15) {
    const relative = signedAngle(degree - heading);
    if (Math.abs(relative) > 69) continue;
    const position = `${50 + relative * (100 / 138)}%`;
    const major = degree % 45 === 0;
    const tick = node('span', major ? 'tick major' : 'tick');
    tick.style.left = position;
    scale.append(tick);
    if (major) {
      const label = node('span', 'tick-label', byAngle(degree).id);
      label.style.left = position;
      scale.append(label);
    }
  }
  for (const landmark of state.world) {
    const relative = signedAngle(dir(landmark.directionId).angle - heading);
    if (Math.abs(relative) > 69) continue;
    const blip = node('span', 'landmark-blip');
    blip.dataset.landmark = landmark.id;
    blip.style.setProperty('--position', `${50 + relative * (100 / 138)}%`);
    blip.append(icon(landmark.id), landmark.name);
    scale.append(blip);
  }
  ui.compassScale.replaceChildren(scale);
}

function renderARLandmarks() {
  const visible = document.createDocumentFragment();
  const left = node('div', 'offscreen-group left');
  const right = node('div', 'offscreen-group right');
  const landmarks = state.world.map(landmark => ({
    ...landmark, relative: signedAngle(dir(landmark.directionId).angle - state.heading)
  })).sort((a, b) => Math.abs(a.relative) - Math.abs(b.relative));
  for (const landmark of landmarks) {
    const relative = landmark.relative;
    if (Math.abs(relative) > 62) {
      const marker = node('span', 'offscreen-marker');
      marker.setAttribute('aria-label', `${landmark.name}在視野${relative < 0 ? '左' : '右'}側`);
      if (relative < 0) {
        marker.append(icon('left'), landmark.name);
        left.append(marker);
      } else {
        marker.append(landmark.name, icon('arrow'));
        right.append(marker);
      }
      continue;
    }
    const marker = node('div', 'ar-landmark');
    marker.dataset.landmark = landmark.id;
    marker.style.setProperty('--position', `${50 + relative * .68}%`);
    const tile = node('span', 'ar-landmark-icon');
    tile.append(icon(landmark.id));
    const label = node('span', 'ar-landmark-name', landmark.name + ' ');
    label.append(node('small', 'mono', metres(Math.hypot(landmark.x, landmark.y))));
    marker.append(tile, label);
    visible.append(marker);
  }
  ui.arMarkerLayer.replaceChildren(visible, left, right);
}

function renderAR() {
  updateSensorUi();
  if (state.mode !== 'ar') return;
  const heading = Math.round(state.heading) % 360;
  ui.arHeadingNumber.textContent = `${pad(heading, 3)}°`;
  ui.facingBadge.textContent = `面向${byAngle(state.heading).name}`;
  renderHUD();
  renderARLandmarks();
}

function scheduleSensorRender() {
  if (sensorRaf) return;
  sensorRaf = window.requestAnimationFrame(() => {
    sensorRaf = 0;
    if (sensorActive && state) renderAR();
  });
}

function orientationRead(event) {
  if (!sensorListening || document.visibilityState === 'hidden') return;
  let raw;
  let source;
  if (Number.isFinite(event.webkitCompassHeading) &&
      (!Number.isFinite(event.webkitCompassAccuracy) || event.webkitCompassAccuracy >= 0)) {
    raw = normalize(event.webkitCompassHeading);
    source = '指南針';
  } else if (Number.isFinite(event.alpha) && sensorSource !== '指南針') {
    if (sensorSource === '絕對角度' && !event.absolute) return;
    raw = normalize(360 - event.alpha);
    source = event.absolute ? '絕對角度' : '相對角度';
  } else {
    return;
  }
  const firstReading = sensorZero === null;
  if (firstReading) sensorZero = raw;
  else if (source !== sensorSource) sensorZero = normalize(raw - state.heading);
  sensorLastRaw = raw;
  sensorSource = source;
  const heading = normalize(raw - sensorZero);
  const changed = firstReading || Math.round(heading) !== Math.round(state.heading);
  state.heading = heading;
  sensorActive = true;
  sensorWaiting = false;
  window.clearTimeout(sensorTimeout);
  if (changed && state.mode === 'ar') scheduleSensorRender();
}

function disableSensor() {
  sensorRequestSeq++;
  window.clearTimeout(sensorTimeout);
  if (sensorRaf) window.cancelAnimationFrame(sensorRaf);
  sensorRaf = 0;
  if (sensorListening) {
    window.removeEventListener('deviceorientation', orientationRead);
    window.removeEventListener('deviceorientationabsolute', orientationRead);
  }
  sensorActive = false;
  sensorListening = false;
  sensorWaiting = false;
  sensorZero = null;
  sensorLastRaw = null;
  sensorSource = '';
  updateSensorUi();
}

async function toggleSensor() {
  if (sensorListening || sensorWaiting) {
    disableSensor();
    toast('已改用轉向按鈕。');
    return;
  }
  if (!window.isSecureContext || typeof DeviceOrientationEvent === 'undefined') {
    toast('方向感應需要 HTTPS 和裝置支援。可用轉向按鈕繼續。');
    return;
  }
  const request = ++sensorRequestSeq;
  sensorWaiting = true;
  updateSensorUi();
  try {
    // iPad Safari requires the permission request to start in the tap handler.
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const permission = await DeviceOrientationEvent.requestPermission(true);
      if (permission !== 'granted') throw new Error('Orientation permission declined');
    }
    if (request !== sensorRequestSeq) return;
    sensorListening = true;
    window.addEventListener('deviceorientation', orientationRead);
    window.addEventListener('deviceorientationabsolute', orientationRead);
    toast('水平轉動 iPad，或按「設為遊戲北」重新校準。');
    sensorTimeout = window.setTimeout(() => {
      if (request !== sensorRequestSeq || !sensorWaiting) return;
      disableSensor();
      toast('暫未收到方向資料。可用轉向按鈕繼續。');
    }, 5000);
  } catch {
    if (request !== sensorRequestSeq) return;
    disableSensor();
    toast('感應器未能啟用。可用轉向按鈕繼續。');
  }
}

function calibrateNorth() {
  if (sensorLastRaw === null) return;
  sensorZero = sensorLastRaw;
  state.heading = 0;
  renderAR();
  toast('目前持機方向已設為遊戲北。');
}

function manualTurn(step) {
  if (sensorActive || sensorWaiting) disableSensor();
  state.heading = normalize(state.heading + step);
  renderAR();
}

function updateCameraUi() {
  selectButton(ui.cameraBtn, cameraReady);
  ui.cameraBtn.classList.toggle('connecting', cameraPending);
  ui.cameraBtnText.textContent = cameraPending ? '取消開啟' : cameraReady ? '關閉自拍' : '自拍背景';
  ui.app.classList.toggle('selfie-on', cameraReady);
}

function stopCamera() {
  cameraRequestSeq++;
  cameraPending = false;
  cameraReady = false;
  const stream = cameraStream;
  cameraStream = null;
  if (stream) stream.getTracks().forEach(track => track.stop());
  ui.cameraVideo.srcObject = null;
  ui.cameraBackdrop.hidden = true;
  updateCameraUi();
}

async function toggleCamera() {
  if (cameraPending || cameraStream) {
    stopCamera();
    return;
  }
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    toast('自拍背景需要 HTTPS 和 Safari 相機權限。');
    return;
  }
  const request = ++cameraRequestSeq;
  cameraPending = true;
  updateCameraUi();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: 'user' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    if (request !== cameraRequestSeq || document.visibilityState === 'hidden') {
      stream.getTracks().forEach(track => track.stop());
      if (request === cameraRequestSeq) stopCamera();
      return;
    }
    cameraStream = stream;
    const track = stream.getVideoTracks()[0];
    const facing = track?.getSettings?.()?.facingMode;
    if (!track || (facing && facing !== 'user')) throw new Error('Front camera unavailable');
    track.addEventListener('ended', () => {
      if (cameraStream !== stream) return;
      stopCamera();
      toast('前鏡頭已停止，已恢復原本背景。');
    });
    ui.cameraVideo.srcObject = stream;
    ui.cameraBackdrop.hidden = false;
    await ui.cameraVideo.play();
    if (request !== cameraRequestSeq) return;
    cameraReady = true;
    cameraPending = false;
    updateCameraUi();
    toast('自拍背景已開啟，畫面只在本機顯示。');
  } catch {
    if (request !== cameraRequestSeq) return;
    stopCamera();
    toast('未能開啟前鏡頭。可繼續作答。');
  }
}

ui.homeBtn.addEventListener('click', showIntro);
ui.chooseModeBtn.addEventListener('click', showIntro);
ui.introTeachingBtn.addEventListener('click', () => setDifficulty('teaching'));
ui.introChallengeBtn.addEventListener('click', () => setDifficulty('challenge'));
ui.startBtn.addEventListener('click', () => { setScreen(true); resetGame(); });
ui.restartBtn.addEventListener('click', () => { resetGame(); toast('已生成新的地圖和八道題目。'); });
ui.mapModeBtn.addEventListener('click', () => setMode('map'));
ui.arModeBtn.addEventListener('click', () => setMode('ar'));
ui.hintBtn.addEventListener('click', showHint);
ui.nextBtn.addEventListener('click', next);
ui.cameraBtn.addEventListener('click', toggleCamera);
ui.sensorBtn.addEventListener('click', toggleSensor);
ui.calibrateBtn.addEventListener('click', calibrateNorth);
for (const button of document.querySelectorAll('[data-turn]')) {
  button.addEventListener('click', () => manualTurn(Number(button.dataset.turn)));
}
window.addEventListener('pagehide', () => { stopCamera(); disableSensor(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') stopCamera();
});
})();
</script>
</body>
</html>
