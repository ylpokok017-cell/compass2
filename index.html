  <body>
    <a class="skip-link" href="#screenRoot">跳到遊戲內容</a>

    <div id="app">
      <div class="world" aria-hidden="true">
        <div class="space-scene">
          <div class="planet planet-one"></div>
          <div class="planet planet-two"></div>
          <div class="horizon-glow"></div>
          <div class="star-field"></div>
        </div>
        <video
          id="cameraVideo"
          class="camera-video"
          autoplay
          muted
          playsinline
          aria-hidden="true"
        ></video>
        <div class="world-grade"></div>
        <div class="screen-grid"></div>
        <div class="scanlines"></div>
        <div class="vignette"></div>
      </div>

      <header class="topbar">
        <div class="brand" aria-label="方向探險站">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="20"></circle>
              <path d="M24 6v6M24 36v6M6 24h6M36 24h6"></path>
              <path class="brand-needle" d="m17 31 5-15 9-2-5 15Z"></path>
              <circle cx="24" cy="24" r="3"></circle>
            </svg>
          </span>
          <span class="brand-copy">
            <strong>方向探險站</strong>
            <small>ORBITAL COMPASS UNIT</small>
          </span>
        </div>

        <div class="lesson-badge">
          <span class="lesson-dot"></span>
          小四 · 八方位訓練
        </div>

        <div class="toolbar">
          <button
            id="cameraControl"
            class="tool-button camera-control"
            type="button"
            hidden
          ></button>
          <button
            id="soundControl"
            class="tool-button icon-button"
            type="button"
            data-action="toggle-sound"
            aria-label="關閉音效"
            title="關閉音效"
          ></button>
        </div>
      </header>

      <main id="screenRoot" class="screen-root" tabindex="-1"></main>

      <div id="toast" class="toast" role="status" hidden></div>

      <div class="portrait-gate" role="dialog" aria-modal="true" aria-labelledby="rotateTitle">
        <div class="portrait-gate-card">
          <div class="rotate-device" aria-hidden="true">
            <span></span>
          </div>
          <p class="eyebrow">ORIENTATION LOCK</p>
          <h2 id="rotateTitle">請將 iPad 橫放</h2>
          <p>方向盤需要較寬的畫面，橫放後就可以繼續探索。</p>
        </div>
      </div>

      <div id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>

    
  </body>
